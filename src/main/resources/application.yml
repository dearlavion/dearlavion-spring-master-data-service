spring:
  application:
    name: dearlavion-spring-master-data-service
  data:
    mongodb:
      # No localhost fallback: every environment, dev included, runs against the Atlas cluster.
      # MONGODB_URI is required — startup fails loudly rather than silently writing to a local
      # Mongo nobody else can see. Passed as an env var (same as auth-service-v3 and
      # payment-service-v2 are launched here) rather than written into this file, which is a
      # public repo.
      uri: ${MONGODB_URI}
      auto-index-creation: true

server:
  port: ${PORT:4012}

app:
  auth-server-url: ${AUTH_SERVER_URL:http://localhost:9081}
  admin-usernames: ${ADMIN_USERNAMES:admin}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
